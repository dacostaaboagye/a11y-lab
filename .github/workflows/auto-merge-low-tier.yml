# Auto-merge low-tier PRs
#
# Enables GitHub native auto-merge (rebase) on PRs labelled
# tier:trivial or tier:minimal, so they
# merge as soon as required checks pass without manual click.
#
# Higher-tier PRs (light, full) keep the human-merge gate. The
# do-not-auto-merge label is an escape hatch on any PR.
#
# One-time setup (run once per repo when this workflow first lands):
#   gh label create tier:trivial --color cccccc
#   gh label create tier:minimal --color e8e8e8
#   gh label create do-not-auto-merge --color d93f0b

name: Auto-merge low-tier PRs

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-auto-merge') &&
      (
        contains(github.event.pull_request.labels.*.name, 'tier:trivial') ||
        contains(github.event.pull_request.labels.*.name, 'tier:minimal')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge --auto --rebase --delete-branch \
            --repo "${{ github.repository }}" \
            "$PR_NUMBER"
